<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Download 4Spares App</title>
  <meta name="description"
    content="Download the 4Spares app for iOS or Android — get vehicle spare parts delivered in minutes." />
  <meta name="robots" content="noindex, follow" />
  <link rel="canonical" href="https://www.4spares.com/download.html" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#FF6B00" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --orange: #FF6B00;
      --dark: #0D0D0D;
      --white: #FFFFFF;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--dark);
      color: var(--white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
    }

    .logo {
      font-size: 1.6rem;
      font-weight: 900;
      color: var(--white);
      text-decoration: none;
      letter-spacing: -0.5px;
      margin-bottom: 32px;
    }

    .logo span {
      color: var(--orange);
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255, 107, 0, 0.2);
      border-top-color: var(--orange);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 24px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 12px;
    }

    p {
      font-size: 0.95rem;
      color: rgba(255, 255, 255, 0.55);
      max-width: 360px;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .fallback-links {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }

    .fallback-links a {
      color: var(--orange);
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
    }

    .fallback-links a:hover {
      text-decoration: underline;
    }
  </style>
  <script>
    (function () {
      var APP_STORE = 'https://apps.apple.com/in/app/4spares-parts-in-minutes/id6780640424';
      var PLAY_STORE = 'https://play.google.com/store/apps/details?id=com.fourspares.app';
      var LANDING = 'https://www.4spares.com/';

      function getDestination() {
        var ua = navigator.userAgent || navigator.vendor || window.opera || '';

        if (/iPad|iPhone|iPod/.test(ua) ||
          (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) {
          return APP_STORE;
        }
        if (/android/i.test(ua)) {
          return PLAY_STORE;
        }
        return LANDING;
      }

      window.location.replace(getDestination());
    })();
  </script>
</head>

<body>
  <a href="https://www.4spares.com/" class="logo">4<span>Spares</span></a>
  <div class="spinner" aria-hidden="true"></div>
  <h1>Redirecting you to 4Spares…</h1>
  <p>If you aren't redirected automatically, choose your platform below.</p>
  <div class="fallback-links">
    <a href="https://apps.apple.com/in/app/4spares-parts-in-minutes/id6780640424">Download on App Store</a>
    <a href="https://play.google.com/store/apps/details?id=com.fourspares.app">Download on Google Play</a>
    <a href="https://www.4spares.com/">Go to 4Spares website</a>
  </div>
</body>

</html>
